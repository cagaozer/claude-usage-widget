# Builds and tests the Windows and macOS widgets.
#
# macOS runner minutes are expensive on private repos, so the macOS job runs only when
# shared or Mac code changes, on version tags, or when started by hand.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release exe
        run: cargo build --release -p claude_usage_widget_win
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget.exe
          path: target/release/ClaudeUsageWidget.exe
          if-no-files-found: error

  # Decides whether this push touched anything the macOS app depends on.
  mac-changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.filter.outputs.mac }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mac:
              - 'core/**'
              - 'macos/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'

  macos:
    needs: mac-changes
    # Run when Mac-relevant files changed, on tags, or on manual runs (where
    # mac-changes is skipped, hence the !cancelled()).
    if: >-
      !cancelled() && (
        needs.mac-changes.outputs.mac == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Full release work (Intel + Apple Silicon build, leak check) only for releases.
      FULL: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test shared core and Mac crate
        run: cargo test -p usage_core -p claude_usage_widget_mac
      - name: Build (debug and release)
        run: |
          cargo build -p claude_usage_widget_mac
          cargo build --release -p claude_usage_widget_mac
      - name: Smoke check (debug build, demo data)
        run: |
          sh macos/scripts/bundle.sh target/debug/claude-usage-widget-mac dist-debug dev
          sh macos/scripts/smoke.sh dist-debug/ClaudeUsageWidget.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke-screenshot
          path: "*.png"
          if-no-files-found: ignore
      - name: Leak check (10 min, releases only)
        if: env.FULL == 'true'
        run: sh macos/scripts/leakcheck.sh dist-debug/ClaudeUsageWidget.app
      - uses: actions/upload-artifact@v4
        if: always() && env.FULL == 'true'
        with:
          name: mac-leak-check
          path: leak.csv
          if-no-files-found: ignore
      - name: Universal binary (Apple Silicon + Intel, releases only)
        if: env.FULL == 'true'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p claude_usage_widget_mac --target aarch64-apple-darwin
          cargo build --release -p claude_usage_widget_mac --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/claude-usage-widget-mac \
            target/aarch64-apple-darwin/release/claude-usage-widget-mac \
            target/x86_64-apple-darwin/release/claude-usage-widget-mac
          lipo -info target/universal/claude-usage-widget-mac
          lipo -verify_arch x86_64 arm64 target/universal/claude-usage-widget-mac
      - name: Assemble, sign and zip the .app
        run: |
          VERSION=$(cargo pkgid -p claude_usage_widget_mac | sed 's/.*[#@]//')
          BIN=target/release/claude-usage-widget-mac
          [ -f target/universal/claude-usage-widget-mac ] && BIN=target/universal/claude-usage-widget-mac
          sh macos/scripts/bundle.sh "$BIN" dist "$VERSION"
          codesign --verify --verbose dist/ClaudeUsageWidget.app
          ditto -c -k --keepParent dist/ClaudeUsageWidget.app ClaudeUsageWidget-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget-mac
          path: ClaudeUsageWidget-mac.zip
          if-no-files-found: error

  # On a version tag, publish both apps as a GitHub Release.
  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ClaudeUsageWidget.exe/ClaudeUsageWidget.exe
            artifacts/ClaudeUsageWidget-mac/ClaudeUsageWidget-mac.zip
          fail_on_unmatched_files: true
