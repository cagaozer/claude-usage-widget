[package]
name = "usage_core"
version = "0.1.1"
edition = "2021"
description = "Platform-neutral core of Claude Usage Widget: usage parsing, fetching, state and layout"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
ureq = "3"

[dev-dependencies]
tempfile = "3"
