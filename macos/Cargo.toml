[package]
name = "claude_usage_widget_mac"
version = "0.1.0"
edition = "2021"
description = "Tiny always-on-top macOS widget showing claude.ai session and weekly usage"
license = "GPL-3.0-or-later"

# Not named "ClaudeUsageWidget" so it never collides with the Windows binary in the shared
# target directory. macos/scripts/bundle.sh copies it into the .app under the proper name.
[[bin]]
name = "claude-usage-widget-mac"
path = "src/main.rs"


# Apple framework bindings are only needed (and only build) on macOS. On other targets
# this crate compiles to an empty `main` so `cargo build --workspace` works anywhere.
[target.'cfg(target_os = "macos")'.dependencies]
usage_core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2"] }
objc2-app-kit = { version = "0.3", features = ["block2"] }
objc2-web-kit = { version = "0.3", features = ["block2"] }
block2 = "0.6"
dispatch2 = "0.3"
security-framework = "3"
